[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogmirror"
version = "0.0.1"
description = "Reading LLM emotion vectors from facial video"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "huggingface_hub>=0.30",
    "modal>=1.0",
]

[project.optional-dependencies]
# Needed wherever the model runs (the Modal image, or a local smoke test).
model = [
    "torch>=2.6",
    "torchvision",  # required by the Gemma 4 processor
    "transformers>=5.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.50",
    "pillow>=10",
]
dev = ["pytest>=8"]
# Offline analysis on the laptop.
analysis = ["scikit-learn>=1.5", "pyarrow>=15"]
notebook = ["matplotlib>=3.8", "jupyter", "nbformat", "nbconvert", "ipykernel", "pyarrow>=15", "scikit-learn", "umap-learn", "pillow"]
# Local video decoding and face tracking (scripts/video_run.py).
video = ["opencv-python-headless", "mediapipe>=1.2", "pyarrow>=15", "pillow>=10"]
# The Rerun viewer export (scripts/rerun_export.py). imageio-ffmpeg bundles an
# ffmpeg binary for transcoding the recorder's WebM files.
viz = ["rerun-sdk>=0.42", "pyarrow>=15", "imageio-ffmpeg", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
