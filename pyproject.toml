[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogmirror"
version = "0.0.1"
description = "Reading LLM emotion vectors from facial video"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "huggingface_hub>=0.30",
    "modal>=1.0",
]

[project.optional-dependencies]
# Needed wherever the model runs (the Modal image, or a local smoke test).
model = [
    "torch>=2.6",
    "torchvision",  # required by the Gemma 4 processor
    "transformers>=5.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.50",
    "pillow>=10",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
